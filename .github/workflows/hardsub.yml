name: Boc hardsub

on:
  workflow_dispatch:
    inputs:
      drive_link:
        description: "Link Google Drive cua video (Chia se: Bat ky ai co link deu xem duoc)"
        required: false
      video_path:
        description: "Hoac duong dan video trong repo (vd input/video.mp4)"
        default: "input/video.mp4"
        required: false
      video_url:
        description: "Hoac link tai video truc tiep khac"
        required: false
      fps:
        description: "So khung hinh/giay quet (nho = nhanh)"
        default: "10"
      roi:
        description: "Vung quet x1,y1,x2,y2 (0,0,1.0,1.0 = toan khung hinh)"
        default: "0,0,1.0,1.0"
      lang:
        description: "ch = gian the, chinese_cht = phon the"
        default: "ch"

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Cai thu vien he thong
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Cai thu vien Python
        run: pip install -r requirements-ci.txt gdown

      - name: Nho model OCR (do tai lai moi lan)
        uses: actions/cache@v4
        with:
          path: ~/.paddleocr
          key: paddleocr-models-v1

      - name: Lay video
        env:
          DRIVE_LINK: ${{ inputs.drive_link }}
          VIDEO_URL: ${{ inputs.video_url }}
          VIDEO_PATH: ${{ inputs.video_path }}
        run: |
          mkdir -p work
          if [ -n "$DRIVE_LINK" ]; then
            gdown --fuzzy "$DRIVE_LINK" -O work/video.mp4 || true
            if [ ! -s work/video.mp4 ] || head -c 2000 work/video.mp4 | grep -qi "<html"; then
              echo "gdown khong tai duoc, thu cach 2..."
              ID=$(echo "$DRIVE_LINK" | grep -oE '[-A-Za-z0-9_]{25,}' | head -1)
              curl -L --fail -o work/video.mp4 "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t"
            fi
          elif [ -n "$VIDEO_URL" ]; then
            curl -L --fail -o work/video.mp4 "$VIDEO_URL"
          else
            cp "$VIDEO_PATH" work/video.mp4
          fi

      - name: Kiem tra video
        run: |
          ls -l work/video.mp4
          file work/video.mp4
          if head -c 2000 work/video.mp4 | grep -qi "<html"; then
            echo "::error::Drive tra ve TRANG WEB chu khong phai video (chua chia se 'Bat ky ai co link', het luot tai, hoac link thu muc)."
            head -c 400 work/video.mp4
            exit 1
          fi
          if ! ffprobe -v error -show_entries format=duration,size -of default=nw=1 work/video.mp4; then
            echo "::error::File video bi hong/tai thieu (moov atom not found). Kiem tra dung luong file tren o tren voi dung luong Drive; hoac video goc chua ghi xong."
            exit 1
          fi

      - name: Boc hardsub
        env:
          FPS: ${{ inputs.fps }}
          ROI: ${{ inputs.roi }}
          LANG_CODE: ${{ inputs.lang }}
        run: |
          mkdir -p out
          python hardsub_extract.py work/video.mp4 -o out/ketqua.srtpx \
            --engine paddleocr --lang "$LANG_CODE" --fps "$FPS" --roi "$ROI" \
            --debug-dir out/debug --debug-every 50

      - name: Tai ket qua ve
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ketqua-srtpx
          path: out/
          if-no-files-found: warn
