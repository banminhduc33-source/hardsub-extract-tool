name: Boc hardsub

on:
  # Tu chay khi co video moi duoc day vao thu muc in/
  push:
    paths:
      - "in/**"
  # Hoac bam chay tay o tab Actions
  workflow_dispatch:
    inputs:
      drive_link:
        description: "Link Google Drive cua video (Chia se: Bat ky ai co link deu xem duoc)"
        required: false
      video_url:
        description: "Hoac link tai video truc tiep khac"
        required: false
      video_path:
        description: "De trong = lay cac video trong in/ chua co ket qua (hoac ghi vd in/tap1.mp4)"
        default: ""
      fps:
        description: "So khung hinh/giay quet (nho = nhanh)"
        default: "10"
      roi:
        description: "Vung quet x1,y1,x2,y2 (0,0,1.0,1.0 = toan khung hinh)"
        default: "0,0,1.0,1.0"
      lang:
        description: "ch = gian the, chinese_cht = phon the"
        default: "ch"

permissions:
  contents: write

concurrency:
  group: hardsub
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Cai thu vien he thong
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 ffmpeg file

      - name: Cai thu vien Python
        run: pip install -r requirements-ci.txt gdown

      - name: Nho model OCR (do tai lai moi lan)
        uses: actions/cache@v4
        with:
          path: ~/.paddleocr
          key: paddleocr-models-v1

      - name: Boc hardsub
        env:
          DRIVE_LINK: ${{ inputs.drive_link }}
          VIDEO_URL: ${{ inputs.video_url }}
          VIDEO_PATH: ${{ inputs.video_path }}
          FPS: ${{ inputs.fps || '10' }}
          ROI: ${{ inputs.roi || '0,0,1.0,1.0' }}
          LANG_CODE: ${{ inputs.lang || 'ch' }}
        run: |
          mkdir -p work out output in
          : > work/queue.txt

          # ---- 1. Lap danh sach video can bóc ----
          if [ -n "$DRIVE_LINK" ]; then
            ID=$(echo "$DRIVE_LINK" | grep -oE '[-A-Za-z0-9_]{25,}' | head -1)
            echo "Drive file ID: $ID"
            gdown "$ID" -O work/link_video.mp4 || echo "gdown khong tai duoc, thu cach 2..."
            MIME=$(file -b --mime-type work/link_video.mp4 2>/dev/null || echo none)
            if [ ! -s work/link_video.mp4 ] || [ "${MIME%%/*}" = "text" ]; then
              curl -L --fail -o work/link_video.mp4 "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t" || true
            fi
            echo "work/link_video.mp4|ketqua" >> work/queue.txt
          elif [ -n "$VIDEO_URL" ]; then
            curl -L --fail -o work/link_video.mp4 "$VIDEO_URL"
            echo "work/link_video.mp4|ketqua" >> work/queue.txt
          elif [ -n "$VIDEO_PATH" ]; then
            f="$VIDEO_PATH"; n=$(basename "${f%.*}")
            echo "$f|$n" >> work/queue.txt
          else
            # Tu dong: moi video trong in/ ma chua co output/<ten>.srtpx
            while IFS= read -r f; do
              n=$(basename "${f%.*}")
              if [ ! -f "output/$n.srtpx" ]; then echo "$f|$n" >> work/queue.txt; fi
            done < <(find in -maxdepth 1 -type f \( -iname '*.mp4' -o -iname '*.mkv' -o -iname '*.avi' -o -iname '*.mov' -o -iname '*.webm' -o -iname '*.flv' -o -iname '*.ts' \) | sort)
          fi

          if [ ! -s work/queue.txt ]; then
            echo "Khong co video moi can boc (moi video trong in/ da co ket qua trong output/)."
            exit 0
          fi
          echo "Danh sach se boc:"; cat work/queue.txt

          # ---- 2. Kiem tra + boc tung video ----
          mapfile -t QUEUE < work/queue.txt
          for line in "${QUEUE[@]}"; do
            SRC="${line%%|*}"; NAME="${line#*|}"
            echo "=============== $SRC ==============="
            if [ ! -f "$SRC" ]; then echo "::error::Khong thay file $SRC"; exit 1; fi
            ls -l "$SRC"
            MIME=$(file -b --mime-type "$SRC")
            echo "Loai file: $MIME"
            case "$MIME" in
              text/*|application/json|application/xml)
                echo "::error::$SRC KHONG phai video ma la '$MIME' (thuong la trang loi cua Drive: link chua chia se 'Bat ky ai co link', link thu muc/sai, hoac het luot tai)."
                echo "Tieu de trang: $(grep -oi '<title>[^<]*' "$SRC" | head -1)"
                echo "--- 600 byte dau ---"; head -c 600 "$SRC"; echo
                exit 1 ;;
            esac
            SIZE=$(stat -c %s "$SRC")
            echo "Dung luong: $SIZE byte"
            echo "16 byte dau (hex): $(head -c 16 "$SRC" | xxd -p)"
            if ! ffprobe -v error -show_entries format=duration,size -of default=nw=1 "$SRC" < /dev/null 2> work/ffprobe_err.txt; then
              echo "::error::ffprobe khong doc duoc $SRC. Loi that su:"
              cat work/ffprobe_err.txt
              echo "Neu dung luong rat nho so voi file tren Drive => tai thieu/bi chan. Neu dung luong dung ma van loi => video goc bi hong (chua ghi xong)."
              exit 1
            fi
            python hardsub_extract.py "$SRC" -o "out/$NAME.srtpx" \
              --engine paddleocr --lang "$LANG_CODE" --fps "$FPS" --roi "$ROI" \
              --debug-dir "out/debug_$NAME" --debug-every 50 < /dev/null
            cp "out/$NAME.srtpx" "output/$NAME.srtpx"
          done

      - name: Luu ket qua vao thu muc output/ cua repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "Khong co ket qua moi de luu."
          else
            git commit -m "Ket qua boc hardsub"
            git pull --rebase
            git push
          fi

      - name: Tai ket qua ve (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ketqua-srtpx
          path: out/
          if-no-files-found: ignore
