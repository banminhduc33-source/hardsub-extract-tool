name: Boc hardsub

on:
  workflow_dispatch:
    inputs:
      video_path:
        description: "Duong dan video trong repo (vd input/video.mp4). Bo qua neu dung link"
        default: "input/video.mp4"
        required: false
      video_url:
        description: "Hoac link tai video truc tiep (neu dien thi dung cai nay)"
        required: false
      fps:
        description: "So khung hinh/giay quet (nho = nhanh)"
        default: "10"
      roi:
        description: "Vung quet x1,y1,x2,y2 (0,0,1.0,1.0 = toan khung hinh)"
        default: "0,0,1.0,1.0"
      lang:
        description: "ch = gian the, chinese_cht = phon the"
        default: "ch"

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Cai thu vien he thong
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Cai thu vien Python
        run: pip install -r requirements-ci.txt

      - name: Nho model OCR (do tai lai moi lan)
        uses: actions/cache@v4
        with:
          path: ~/.paddleocr
          key: paddleocr-models-v1

      - name: Lay video
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          VIDEO_PATH: ${{ inputs.video_path }}
        run: |
          mkdir -p work
          if [ -n "$VIDEO_URL" ]; then
            curl -L --fail -o work/video.mp4 "$VIDEO_URL"
          else
            cp "$VIDEO_PATH" work/video.mp4
          fi
          ls -lh work/video.mp4

      - name: Boc hardsub
        env:
          FPS: ${{ inputs.fps }}
          ROI: ${{ inputs.roi }}
          LANG_CODE: ${{ inputs.lang }}
        run: |
          mkdir -p out
          python hardsub_extract.py work/video.mp4 -o out/ketqua.srtpx \
            --engine paddleocr --lang "$LANG_CODE" --fps "$FPS" --roi "$ROI" \
            --debug-dir out/debug --debug-every 50

      - name: Tai ket qua ve
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ketqua-srtpx
          path: out/
          if-no-files-found: warn
