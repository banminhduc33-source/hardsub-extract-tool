name: Boc hardsub

on:
  # Tu chay khi co video moi duoc day vao thu muc in/ cua repo
  push:
    paths:
      - "in/**"
  # Du phong: quet Google Drive (srtpx/in) moi gio (Apps Script da goi ngay khi co video)
  schedule:
    - cron: "0 * * * *"
  # Apps Script goi cai nay, hoac bam chay tay o tab Actions
  workflow_dispatch:
    inputs:
      drive_link:
        description: "Link Google Drive cua video (Chia se: Bat ky ai co link deu xem duoc)"
        required: false
      video_url:
        description: "Hoac link tai video truc tiep khac"
        required: false
      video_path:
        description: "De trong = lay cac video trong in/ chua co ket qua (hoac ghi vd in/tap1.mp4)"
        default: ""
      fps:
        description: "So khung hinh/giay quet (nho = nhanh)"
        default: "12"
      roi:
        description: "Vung quet x1,y1,x2,y2 (0,0,1.0,1.0 = toan khung hinh)"
        default: "0,0,1.0,1.0"
      lang:
        description: "ch = gian the, chinese_cht = phon the"
        default: "ch"
      translate:
        description: "Dich sang tieng Viet bang Gemini (can secret GEMINI_API_KEYS)"
        type: boolean
        default: true
      model:
        description: "Model Gemini dung de dich"
        default: "gemini-4-hydrogen"
      retranslate:
        description: "Dich LAI bang ban Trung da co (output/*.zh.srtpx) voi bang ten glossary.txt, KHONG boc lai video. De trong video_path = dich lai tat ca; hoac ghi vd in/tap1.mp4 de chi dich lai tap do"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hardsub
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      REMOTE: gd   # TEN remote trong rclone.conf (dong [gd])
    steps:
      - uses: actions/checkout@v4

      # ---------- GOOGLE DRIVE: LAY VIDEO MOI ----------
      - name: Cai rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Lay video moi tu Drive (srtpx/in)
        id: drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          mkdir -p in work
          ENABLED=false
          NEW=0

          if [ -n "${RCLONE_CONF:-}" ]; then
            mkdir -p ~/.config/rclone
            printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
            chmod 600 ~/.config/rclone/rclone.conf
            if rclone lsd "$REMOTE:srtpx" > /dev/null 2>&1; then
              ENABLED=true
            else
              echo "::warning::Khong ket noi duoc $REMOTE:srtpx (kiem tra ten remote REMOTE va thu muc srtpx tren Drive)."
            fi
          else
            echo "Chua co secret RCLONE_CONF -> bo qua phan Google Drive."
          fi

          if [ "$ENABLED" = "true" ]; then
            # Ket qua nam canh video trong srtpx/in -> coi nhu da xu ly
            # (chi tinh file <ten>.srtpx; file <ten>.zh.srtpx = ban tieng Trung chua dich -> van se thu lai)
            rclone lsf --ignore-case "$REMOTE:srtpx/in" --include "*.srtpx" > work/drive_done.txt 2>/dev/null || true
            # Bo qua file vua sua duoi 2 phut (tranh file dang tai len do)
            rclone lsf --ignore-case "$REMOTE:srtpx/in" --min-age 2m \
              --include "*.{mp4,mkv,avi,mov,flv,webm,m4v,ts,wmv}" > work/drive_todo.txt || true

            while IFS= read -r f; do
              [ -z "$f" ] && continue
              stem="${f%.*}"
              if grep -Fxq "$stem.srtpx" work/drive_done.txt; then
                echo "Bo qua (da co ket qua): $f"
                continue
              fi
              echo "Tai tu Drive: $f"
              if rclone copyto "$REMOTE:srtpx/in/$f" "in/$f" < /dev/null; then
                rm -f "output/$stem.srtpx"   # video trung ten: bo ket qua cu de boc lai
                NEW=$((NEW+1))
              else
                echo "::warning::Loi tai $f"
              fi
            done < work/drive_todo.txt
          fi

          # Chay lich (schedule) ma khong co video moi -> bo qua phan nang
          if [ "$EVENT" != "schedule" ] || [ "$NEW" -gt 0 ]; then GO=true; else GO=false; fi
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "go=$GO" >> "$GITHUB_OUTPUT"
          echo "Drive enabled=$ENABLED | video moi=$NEW | chay tiep=$GO"

      # ---------- BOC HARDSUB ----------
      - uses: actions/setup-python@v5
        if: steps.drive.outputs.go == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Cai thu vien he thong
        if: steps.drive.outputs.go == 'true'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 ffmpeg file

      - name: Cai thu vien Python
        if: steps.drive.outputs.go == 'true'
        run: pip install -r requirements-ci.txt gdown

      - name: Nho model OCR (do tai lai moi lan)
        if: steps.drive.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.paddleocr
          key: paddleocr-models-v1

      - name: Boc hardsub
        if: steps.drive.outputs.go == 'true'
        env:
          DRIVE_LINK: ${{ inputs.drive_link }}
          VIDEO_URL: ${{ inputs.video_url }}
          VIDEO_PATH: ${{ inputs.video_path }}
          FPS: ${{ inputs.fps || '12' }}
          ROI: ${{ inputs.roi || '0,0,1.0,1.0' }}
          LANG_CODE: ${{ inputs.lang || 'ch' }}
          TRANSLATE: ${{ github.event_name == 'workflow_dispatch' && inputs.translate == false && 'false' || 'true' }}
          RETRANSLATE: ${{ github.event_name == 'workflow_dispatch' && inputs.retranslate == true && 'true' || 'false' }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          # Mac dinh gemini-4-hydrogen (bo qua bien repo GEMINI_MODEL cu de khoi dinh nham model da ngung)
          GEMINI_MODEL: ${{ inputs.model || 'gemini-4-hydrogen' }}
          # Tong thoi gian toi da de thu dich lai cho MOI video (phut) va thoi gian toi da moi lan thu (phut)
          TRANSLATE_MAX_MIN: "150"
          TRANSLATE_ATTEMPT_MIN: "30"
          # Tranh SIGILL cua Paddle tren CPU runner (khong co oneDNN/AVX day du)
          FLAGS_use_mkldnn: "0"
          OMP_NUM_THREADS: "2"
        run: |
          mkdir -p work out output in
          : > work/queue.txt
          FAILED_TRANSLATE=0

          # ---------- Ham tro giup: dem chu Han trong file ----------
          han_count() {
            python - "$1" <<'PY'
          import re, sys
          t = open(sys.argv[1], encoding="utf-8", errors="ignore").read()
          print(len(re.findall(r"[\u3400-\u4dbf\u4e00-\u9fff]", t)))
          PY
          }

          # ---------- Ham dich co thu lai ----------
          # Thu den khi: script dich thanh cong VA con <=10% chu Han (tuc la that su da dich).
          # Loi API / 429 / timeout / dich do -> khoi phuc ban Trung roi thu lai, nghi tang dan.
          # Dung khi het TRANSLATE_MAX_MIN phut.
          translate_with_retry() {
            local name="$1"
            local zh="work/$name.zh.srtpx"
            local target="out/$name.srtpx"
            local zh_han left n=0 wait_s now deadline
            zh_han=$(han_count "$zh")
            if [ "$zh_han" -eq 0 ]; then
              echo "Khong co chu Han de dich trong $name."
              cp "$zh" "$target"
              return 0
            fi
            deadline=$(( $(date +%s) + TRANSLATE_MAX_MIN * 60 ))
            while :; do
              n=$((n+1))
              cp "$zh" "$target"   # luon dich tu ban Trung nguyen ven
              echo ">>> Dich lan $n: $name | model=$GEMINI_MODEL | chu Han goc=$zh_han"
              if timeout "${TRANSLATE_ATTEMPT_MIN}m" python translate_srtpx.py "$target" \
                   --model "$GEMINI_MODEL" < /dev/null; then
                left=$(han_count "$target")
                if [ $((left * 100)) -le $((zh_han * 10)) ]; then
                  echo "Da dich xong: $name (lan $n, con $left/$zh_han chu Han)"
                  return 0
                fi
                echo "::warning::Lan $n: script bao xong nhung con $left/$zh_han chu Han -> thu lai"
              else
                echo "::warning::Lan $n: loi/timeout khi goi Gemini -> thu lai"
              fi
              wait_s=$(( n * 20 )); [ "$wait_s" -gt 300 ] && wait_s=300
              now=$(date +%s)
              if [ $((now + wait_s)) -ge "$deadline" ]; then
                echo "::error::Het $TRANSLATE_MAX_MIN phut thu dich lai cho $name (da thu $n lan)."
                cp "$zh" "$target"
                return 1
              fi
              echo "Cho ${wait_s}s roi thu lai..."
              sleep "$wait_s"
            done
          }

          # ---- 0. Che do DICH LAI: dung ban Trung da co + bang ten glossary.txt, khong boc lai video ----
          if [ "$RETRANSLATE" = "true" ]; then
            if [ -z "${GEMINI_API_KEYS:-}" ]; then
              echo "::error::Dich lai can secret GEMINI_API_KEYS."
              exit 1
            fi
            if [ -f glossary.txt ]; then
              echo "Bang ten: glossary.txt ($(tr ';' '\n' < glossary.txt | grep -c '/') muc)"
            else
              echo "::warning::Khong thay glossary.txt -> dich khong co bang ten."
            fi
            shopt -s nullglob
            if [ -n "$VIDEO_PATH" ]; then
              RT_FILES=("output/$(basename "${VIDEO_PATH%.*}").zh.srtpx")
            else
              RT_FILES=(output/*.zh.srtpx)
            fi
            if [ "${#RT_FILES[@]}" -eq 0 ]; then
              echo "Khong co ban Trung (output/*.zh.srtpx) de dich lai."
              exit 0
            fi
            for zhsrc in "${RT_FILES[@]}"; do
              if [ ! -f "$zhsrc" ]; then
                echo "::error::Khong thay $zhsrc"
                FAILED_TRANSLATE=1
                continue
              fi
              NAME=$(basename "$zhsrc" .zh.srtpx)
              echo "=============== Dich lai: $NAME ==============="
              cp "$zhsrc" "work/$NAME.zh.srtpx"
              if translate_with_retry "$NAME"; then
                cp "out/$NAME.srtpx" "output/$NAME.srtpx"     # ban Viet moi (co bang ten)
              else
                # Dich that bai: giu nguyen ban Viet cu trong output/, khong ghi de, khong day len Drive
                FAILED_TRANSLATE=1
                rm -f "out/$NAME.srtpx"
              fi
            done
            if [ "$FAILED_TRANSLATE" -eq 1 ]; then
              echo "::error::Co video dich lai that bai (ban cu duoc giu nguyen)."
              exit 1
            fi
            exit 0
          fi

          # ---- 1. Lap danh sach video can boc ----
          if [ -n "$DRIVE_LINK" ]; then
            ID=$(echo "$DRIVE_LINK" | grep -oE '[-A-Za-z0-9_]{25,}' | head -1)
            echo "Drive file ID: $ID"
            gdown "$ID" -O work/link_video.mp4 || echo "gdown khong tai duoc, thu cach 2..."
            MIME=$(file -b --mime-type work/link_video.mp4 2>/dev/null || echo none)
            if [ ! -s work/link_video.mp4 ] || [ "${MIME%%/*}" = "text" ]; then
              curl -L --fail -o work/link_video.mp4 "https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t" || true
            fi
            echo "work/link_video.mp4|ketqua" >> work/queue.txt
          elif [ -n "$VIDEO_URL" ]; then
            curl -L --fail -o work/link_video.mp4 "$VIDEO_URL"
            echo "work/link_video.mp4|ketqua" >> work/queue.txt
          elif [ -n "$VIDEO_PATH" ]; then
            f="$VIDEO_PATH"; n=$(basename "${f%.*}")
            echo "$f|$n" >> work/queue.txt
          else
            # Tu dong: moi video trong in/ ma chua co output/<ten>.srtpx
            while IFS= read -r f; do
              n=$(basename "${f%.*}")
              if [ ! -f "output/$n.srtpx" ]; then echo "$f|$n" >> work/queue.txt; fi
            done < <(find in -maxdepth 1 -type f \( -iname '*.mp4' -o -iname '*.m4v' -o -iname '*.wmv' -o -iname '*.mkv' -o -iname '*.avi' -o -iname '*.mov' -o -iname '*.webm' -o -iname '*.flv' -o -iname '*.ts' \) | sort)
          fi

          if [ ! -s work/queue.txt ]; then
            echo "Khong co video moi can boc."
            exit 0
          fi
          echo "Danh sach se boc:"; cat work/queue.txt

          # ---- 2. Kiem tra + boc tung video ----
          mapfile -t QUEUE < work/queue.txt
          for line in "${QUEUE[@]}"; do
            SRC="${line%%|*}"; NAME="${line#*|}"
            echo "=============== $SRC ==============="
            if [ ! -f "$SRC" ]; then echo "::error::Khong thay file $SRC"; exit 1; fi
            ls -l "$SRC"
            MIME=$(file -b --mime-type "$SRC")
            echo "Loai file: $MIME"
            case "$MIME" in
              text/*|application/json|application/xml)
                echo "::error::$SRC KHONG phai video ma la '$MIME' (thuong la trang loi cua Drive: link chua chia se 'Bat ky ai co link', link thu muc/sai, hoac het luot tai)."
                echo "Tieu de trang: $(grep -oi '<title>[^<]*' "$SRC" | head -1)"
                echo "--- 600 byte dau ---"; head -c 600 "$SRC"; echo
                exit 1 ;;
            esac
            SIZE=$(stat -c %s "$SRC")
            echo "Dung luong: $SIZE byte"
            echo "16 byte dau (hex): $(head -c 16 "$SRC" | xxd -p)"
            if ! ffprobe -v error -show_entries format=duration,size -of default=nw=1 "$SRC" < /dev/null 2> work/ffprobe_err.txt; then
              echo "::error::ffprobe khong doc duoc $SRC. Loi that su:"
              cat work/ffprobe_err.txt
              echo "Neu dung luong rat nho so voi file tren Drive => tai thieu/bi chan. Neu dung luong dung ma van loi => video goc bi hong (chua ghi xong)."
              exit 1
            fi
            python hardsub_extract.py "$SRC" -o "out/$NAME.srtpx" \
              --engine paddleocr --lang "$LANG_CODE" --fps "$FPS" --roi "$ROI" \
              --debug-dir "out/debug_$NAME" --debug-every 50 < /dev/null

            # ---- Dich Trung -> Viet bang Gemini (thu lai den khi duoc) ----
            if [ "$TRANSLATE" = "true" ] && [ -n "${GEMINI_API_KEYS:-}" ]; then
              cp "out/$NAME.srtpx" "work/$NAME.zh.srtpx"      # ban Trung nguyen ven de thu lai
              if translate_with_retry "$NAME"; then
                cp "work/$NAME.zh.srtpx" "output/$NAME.zh.srtpx"   # giu ban tieng Trung
                cp "out/$NAME.srtpx" "output/$NAME.srtpx"          # ban Viet = ket qua chinh
              else
                # Dich that bai het han: luu ban Trung duoi ten .zh.srtpx (KHONG danh dau la xong)
                # -> lan chay sau (lich moi gio / chay tay) se tu thu lai cho video nay.
                FAILED_TRANSLATE=1
                cp "work/$NAME.zh.srtpx" "out/$NAME.zh.srtpx"
                cp "work/$NAME.zh.srtpx" "output/$NAME.zh.srtpx"
                rm -f "out/$NAME.srtpx" "output/$NAME.srtpx"
              fi
            else
              echo "Bo qua dich (tat hoac chua co secret GEMINI_API_KEYS)."
              cp "out/$NAME.srtpx" "output/$NAME.srtpx"
            fi
          done

          if [ "$FAILED_TRANSLATE" -eq 1 ]; then
            echo "::error::Co video chua dich duoc. Ban tieng Trung da luu (.zh.srtpx); lan chay sau se thu lai."
            exit 1
          fi

      # ---------- GOOGLE DRIVE: DAY KET QUA LEN srtpx/in (CANH VIDEO) ----------
      - name: Day ket qua len Drive (srtpx/in, canh video)
        if: always() && steps.drive.outputs.enabled == 'true' && steps.drive.outputs.go == 'true'
        run: |
          if ls out/*.srtpx > /dev/null 2>&1; then
            rclone copy out "$REMOTE:srtpx/in" --include "*.srtpx" -v
          else
            echo "Khong co file .srtpx moi de day len Drive."
          fi

      - name: Luu ket qua vao thu muc output/ cua repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "Khong co ket qua moi de luu."
          else
            git commit -m "Ket qua boc hardsub"
            git pull --rebase
            git push
          fi

      - name: Tai ket qua ve (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ketqua-srtpx
          path: out/
